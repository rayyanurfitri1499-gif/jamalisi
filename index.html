<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0714">
<title>Spesial Edition</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="crown">👑</span>
    <span class="brand-text">SPESIAL EDITION</span>
  </div>
  <div class="search">
    <input id="cari" type="search" placeholder="Cari video...">
  </div>
</header>

<main>
  <section id="page-home" class="page aktif">
    <div class="slider-wrap">
      <div id="slider" class="slider"></div>
      <div id="dots" class="dots"></div>
    </div>
    <div class="sec-head">
      <h2>🔥 Video Terbaru</h2>
      <span id="jumlah" class="muted"></span>
    </div>
    <div id="grid-home" class="grid"></div>
  </section>

  <section id="page-langganan" class="page"></section>
  <section id="page-aktivitas" class="page"></section>
  <section id="page-akun" class="page"></section>
</main>

<div id="player" class="modal">
  <div class="modal-box">
    <button id="ptutup" class="x">✕</button>
    <video id="pv" controls playsinline></video>
    <div class="pbar">
      <b id="pjudul"></b>
      <button id="pfav">★</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<nav class="bottom">
  <button data-page="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>Home
  </button>
  <button data-page="langganan">
    <svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>VIP PREMIUM
  </button>
  <button data-page="aktivitas">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.4l4 2.4-1 1.7-5-3V7z"/></svg>Aktivitas
  </button>
  <button data-page="akun">
    <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>Akun
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js?v=114"></script>
<script src="iklan.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
  </html>
